name: Ruff

on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"

      - name: Run ruff check
        run: ruff check

      - name: Run ruff format
        run: ruff format --check
